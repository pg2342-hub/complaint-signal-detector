[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-signal-detector"
version = "0.1.0"
description = "Find emerging product failure modes in public FDA device complaint reports"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6", "golive-gate @ git+https://github.com/pg2342-hub/golive-gate"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
csd = "csd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
